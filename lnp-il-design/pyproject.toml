[project]
name = "lnp-il-design"
version = "0.1.0"
description = "Public-data pipeline for LNP transfection prediction and ionizable lipid design"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.6",
    "rdkit>=2026.3.6",
    "typer>=0.27.2",
]

[project.scripts]
lnp-il = "lnp_il.cli.main:app"

[dependency-groups]
dev = ["ruff", "ty", "pytest", "pytest-cov"]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lnp_il"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "TCH",  # type-checking import organisation
  "RUF",  # ruff-specific rules
]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = ["--cov=src"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"
